name: Emergency recovery of original playback (ads remain)
on:
  push:
    paths:
      - '.github/workflows/zona-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ZONA_KEY_PASSWORD: ${{ secrets.ZONA_KEY_PASSWORD }}
      KEY_B64: ${{ secrets.ZONA_SIGNING_P12_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install --no-cache-dir 'cryptography>=42,<47'
      - name: Download original Zona and validate version
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --proto '=https' --proto-redir '=https' --max-time 180 \
            'https://zon.im/a' -o original.apk
          python - <<'PY'
          from zona_build import manifest_info, signing_certificate_digest, OFFICIAL_SIGNER
          assert signing_certificate_digest('original.apk') == OFFICIAL_SIGNER
          info=manifest_info('original.apk')
          assert info['package']=='mobi.zona' and str(info['versionName'])=='3.0.76' and int(info['versionCode'])==1076, info
          print('Verified official original Zona 3.0.76 versionCode 1076')
          PY
      - name: Build a recovery APK using existing private signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZONA_KEY_PASSWORD" && test -n "$KEY_B64"
          printf '%s' "$KEY_B64" | base64 -d > signing.p12
          chmod 600 signing.p12
          python zona_build.py original.apk --key signing.p12 --out Zona_3.0.76_Recovery_WITH_ADS.apk --restore-original
      - name: Publish recovery APK (no VAST changes)
        shell: bash
        run: |
          set -euo pipefail
          name=Zona_3.0.76_Recovery_WITH_ADS.apk
          tag=zona-1076-recovery
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$name" "$name.json" --clobber
          else
            gh release create "$tag" "$name" "$name.json" \
              --title 'Zona 3.0.76 Recovery — original playback, ads remain' \
              --notes 'Recovery: original Zona playback code, same custom certificate as 3.0.76 NoVAST. ADS WILL APPEAR. Intended to install over broken custom APK while preserving app data. Device installation still requires confirmation.'
          fi
      - name: Remove secrets and temporary APKs
        if: always()
        run: rm -f signing.p12 original.apk
