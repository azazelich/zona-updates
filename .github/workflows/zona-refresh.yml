name: Check upstream Zona and build NoVAST

on:
  push:
    paths:
      - 'zona_build.py'
      - '.github/workflows/zona-refresh.yml'
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
    inputs:
      upstream_url:
        description: 'Official Zona APK URL (optional)'
        required: false
        default: 'https://zon.im/a'
        type: string

permissions:
  contents: write

concurrency:
  group: zona-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the build scripts
        uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Java for Android v1 signing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install cryptography
        run: python -m pip install --no-cache-dir 'cryptography>=42,<47'
      - name: Fetch the official Android APK
        env:
          CUSTOM_URL: ${{ inputs.upstream_url }}
        shell: bash
        run: |
          set -euo pipefail
          # This project patches Android TV Zona 3.x only.
          # NEVER use the zona2.apk endpoint: it serves an incompatible 2.x build.
          # Verify the developer's APK signature and supported major version below.
          urls=()
          if [[ -n "${CUSTOM_URL:-}" ]]; then
            urls+=("$CUSTOM_URL")
          fi
          urls+=("https://zon.im/a")
          fetched=false
          for url in "${urls[@]}"; do
            echo "Attempting official source: $url"
            rm -f upstream.apk
            if curl --fail --location --silent --show-error --retry 2 --retry-delay 3 \
                    --connect-timeout 20 --max-time 240 --proto '=https' --proto-redir '=https' \
                    --output upstream.apk -- "$url"; then
              if python - <<'PY'
          import os, sys, zipfile
          path = 'upstream.apk'
          valid = os.path.getsize(path) > 10_000_000 and zipfile.is_zipfile(path)
          sys.exit(0 if valid else 1)
          PY
              then
                echo "Downloaded an APK container successfully."
                fetched=true
                break
              fi
              echo "Downloaded file is not a valid APK container."
            else
              echo "Download failed; trying next official source."
            fi
          done
          if [[ "$fetched" != true ]]; then
            echo "::error::All official Zona APK download endpoints failed."
            exit 1
          fi
      - name: Inspect official signature and version
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from zona_build import manifest_info, signing_certificate_digest, OFFICIAL_SIGNER
          import os, re
          info = manifest_info('upstream.apk')
          assert info['package'] == 'mobi.zona', 'Wrong package'
          assert signing_certificate_digest('upstream.apk') == OFFICIAL_SIGNER, 'Official signature changed'
          name = str(info['versionName'])
          code = int(info['versionCode'])
          assert name.startswith('3.'), 'This updater only handles Android TV Zona 3.x'
          assert re.fullmatch(r'\d+(?:\.\d+){1,4}', name), 'Unexpected version name'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('version_name=' + name, file=f)
              print('version_code=' + str(code), file=f)
          print('Original Zona', name, 'versionCode', code)
          PY
          version="$(python -c "from zona_build import manifest_info; print(manifest_info('upstream.apk')['versionCode'])")"
          tag="zona-$version"
          sdk="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p previous-release
            if gh release download "$tag" --pattern 'Zona_*_NoVAST.apk' --dir previous-release --clobber; then
              previous="$(find previous-release -name '*.apk' -type f | head -1)"
              if [[ -n "$previous" ]] &&
                 "$sdk/apksigner" verify "$previous" &&
                 "$sdk/zipalign" -c 4 "$previous" &&
                 python -c "from zona_build import signing_certificate_digest, CUSTOM_SIGNER; assert signing_certificate_digest('$previous') == CUSTOM_SIGNER"; then
                echo 'already=true' >> "$GITHUB_OUTPUT"
                echo 'Existing release passed apksigner and zipalign; no replacement needed.' >> "$GITHUB_STEP_SUMMARY"
              else
                echo 'already=false' >> "$GITHUB_OUTPUT"
                echo 'Existing release FAILED installation preflight; rebuilding and replacing it.' >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo 'already=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check required encrypted signing secrets
        id: keys
        env:
          KEY_BASE64: ${{ secrets.ZONA_SIGNING_P12_B64 }}
          KEY_PASSWORD: ${{ secrets.ZONA_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEY_BASE64" && -n "$KEY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets not configured. No APK has been published.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Decode signing key in temporary runner
        if: steps.inspect.outputs.already == 'false' && steps.keys.outputs.ready == 'true'
        env:
          KEY_BASE64: ${{ secrets.ZONA_SIGNING_P12_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEY_BASE64" | base64 -d > signing.p12
          chmod 600 signing.p12
      - name: Patch, v1+v2 sign, and verify
        if: steps.inspect.outputs.already == 'false' && steps.keys.outputs.ready == 'true'
        env:
          ZONA_KEY_PASSWORD: ${{ secrets.ZONA_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.inspect.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          python zona_build.py upstream.apk --key signing.p12 --out "Zona_${VERSION_NAME}_NoVAST.apk"
      - name: Release signed APK and publish update manifest
        if: steps.inspect.outputs.already == 'false' && steps.keys.outputs.ready == 'true'
        env:
          VERSION_NAME: ${{ steps.inspect.outputs.version_name }}
          VERSION_CODE: ${{ steps.inspect.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          file="Zona_${VERSION_NAME}_NoVAST.apk"
          tag="zona-${VERSION_CODE}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" "${file}.json" --clobber
            echo 'Replaced invalid existing APK with correctly ZIP-aligned build.' >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$tag" "$file" "${file}.json" \
              --title "Zona ${VERSION_NAME} NoVAST (experimental)" \
              --notes 'Based on officially signed Zona, locally patched and re-signed. Signature and ZIP alignment verified. Android TV runtime not yet tested.'
          fi
          python - <<'PY'
          import json, os
          name = os.environ['VERSION_NAME']; code = int(os.environ['VERSION_CODE'])
          file = f'Zona_{name}_NoVAST.apk'
          report = json.load(open(file+'.json', encoding='utf-8'))
          record = {
              'package': 'mobi.zona',
              'appVersion': name,
              'versionCode': code,
              'apkUrl': f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/zona-{code}/{file}',
              'sha256': report['sha256'],
              'signingCertificateSha256': report['signingCertificate'],
              'experimental': True,
              'requiresUserConfirmation': True
          }
          os.makedirs('updates', exist_ok=True)
          with open('updates/latest.json', 'w', encoding='utf-8') as f:
              json.dump(record, f, ensure_ascii=False, indent=2)
          PY
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add updates/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Zona ${VERSION_NAME} release metadata"
            git push origin HEAD:main
          fi
      - name: Remove signing key and downloaded APK
        if: always()
        shell: bash
        run: rm -f signing.p12 upstream.apk
